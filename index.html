<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline Trivia</title>
  <meta name="theme-color" content="#12131a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trivia" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">

    <section id="screen-categories" class="screen">
      <header class="app-header">
        <h1>Offline Trivia</h1>
        <p class="subtitle">Pick a category to start a round</p>
      </header>
      <div id="category-list" class="category-list" aria-live="polite"></div>
      <p id="categories-status" class="status-text"></p>
      <footer class="app-footer">
        <p id="app-version" class="app-version"></p>
      </footer>
    </section>

    <section id="screen-settings" class="screen hidden">
      <header class="app-header">
        <h1 id="settings-category-name"></h1>
        <p class="subtitle">Choose your round settings</p>
      </header>
      <div class="settings-group">
        <p class="settings-label">Number of questions</p>
        <div id="count-options" class="toggle-group"></div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Difficulty</p>
        <div id="difficulty-options" class="toggle-group"></div>
      </div>
      <p id="settings-availability" class="status-text"></p>
      <div class="settings-spacer"></div>
      <button id="start-round-btn" class="primary-btn">Start Round</button>
      <button id="settings-back-btn" class="secondary-btn">Back</button>
    </section>

    <section id="screen-quiz" class="screen hidden">
      <header class="quiz-header">
        <button id="quit-btn" class="icon-btn" aria-label="Quit round">✕</button>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="question-counter" class="question-counter"></span>
      </header>
      <div class="quiz-body">
        <p id="question-category" class="question-category"></p>
        <h2 id="question-text" class="question-text"></h2>
        <div id="options-list" class="options-list"></div>
      </div>
      <button id="next-btn" class="primary-btn hidden">Next</button>
    </section>

    <section id="screen-results" class="screen hidden">
      <header class="app-header">
        <h1 id="results-score"></h1>
        <p id="results-subtitle" class="subtitle"></p>
      </header>
      <div id="results-review" class="results-review"></div>
      <div class="results-actions">
        <button id="play-again-btn" class="primary-btn">Play Again</button>
        <button id="choose-category-btn" class="secondary-btn">Choose Category</button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
